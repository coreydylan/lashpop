<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>copy review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--
  ============================================================================
  COPY-REVIEW TEMPLATE  ·  fill THEME, LEXICON, and PIECES below, then `open` it.
  ----------------------------------------------------------------------------
  HOW CLAUDE FILLS THIS IN:
    1. THEME      — fonts, colors, project name, phone-frame on/off. Pull from the
                    project's design tokens when known; otherwise tweak the dark
                    defaults (or set THEME.mode:"light"). Update the @import URL
                    below to load whatever Google Fonts THEME names.
    2. LEXICON    — preferred[] words to encourage, banned[] words to flag live.
    3. PIECES[]   — the copy beats. See the schema comment above the PIECES array.

  WHAT THE HUMAN DOES:
    Reviews each card against a live styled preview, edits inline, sets a status
    (approved / needs-work / rejected), leaves a per-piece note, picks a variant
    winner, reorders/adds/removes pieces, then EXPORTS.

  WHAT CLAUDE CONSUMES:
    The exported JSON (schema documented at doExportJSON below). Parse per-piece
    status + note + chosenVariant + final order, then apply the changes.
  ============================================================================
-->
<!-- FONTS: edit this URL to match THEME.titleFont / THEME.bodyFont -->
<link id="fontlink" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style id="themecss"></style>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--bodyFont),system-ui,sans-serif;color:var(--fg);padding-bottom:96px;
       background:var(--bgGrad)}
  header{position:sticky;top:0;z-index:30;background:var(--headBg);backdrop-filter:blur(8px);
         border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.01em}
  header .sub{opacity:.5;font-size:12px;max-width:46ch}
  .count{margin-left:auto;font-size:13px;opacity:.85;display:flex;gap:12px;align-items:center}
  .count b{color:var(--accent)}
  .pill-stat{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
  .pill-stat.ok{color:var(--ok);border-color:var(--ok)}
  .pill-stat.warn{color:var(--warn);border-color:var(--warn)}
  .pill-stat.rej{color:var(--rej);border-color:var(--rej)}
  .toolbar{position:sticky;top:49px;z-index:25;background:var(--headBg);backdrop-filter:blur(8px);
           border-bottom:1px solid var(--line);padding:8px 22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px}
  .toolbar label{display:flex;gap:5px;align-items:center;opacity:.8;cursor:pointer}
  .toolbar .keyhint{margin-left:auto;opacity:.45}
  .wrap{max-width:780px;margin:0 auto;padding:22px 18px}
  .phase{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
         opacity:.7;margin:32px 4px 12px;font-weight:600}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:14px 0;overflow:hidden;
        transition:border-color .18s, box-shadow .18s, opacity .18s}
  .card.status-approved{border-color:var(--ok);box-shadow:0 0 0 1px color-mix(in srgb,var(--ok) 35%,transparent)}
  .card.status-needs-work{border-color:var(--warn);box-shadow:0 0 0 1px color-mix(in srgb,var(--warn) 30%,transparent)}
  .card.status-rejected{border-color:var(--rej);opacity:.62}
  .card.focused{outline:2px solid var(--accent);outline-offset:2px}
  .card.hidden{display:none}
  .chead{display:flex;align-items:baseline;gap:10px;padding:13px 18px 0}
  .grip{cursor:grab;opacity:.35;font-size:14px;user-select:none;padding-right:2px}
  .grip:active{cursor:grabbing}
  .name{font-weight:700;font-size:15px}
  .when{font-size:12px;opacity:.5}
  .movebtns{margin-left:auto;display:flex;gap:4px}
  .movebtns button{background:none;border:1px solid var(--line);color:var(--fg);opacity:.6;border-radius:6px;
        width:24px;height:22px;cursor:pointer;font-size:11px;line-height:1}
  .movebtns button:hover{opacity:1}

  /* app-style preview */
  .preview{margin:14px 18px;border-radius:14px;padding:26px 20px;text-align:center;
           background:var(--pvBg);border:1px solid var(--pvLine);min-height:120px;
           display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  .pv-title{font-family:var(--titleFont),sans-serif;font-weight:600;font-size:23px;color:var(--accent);line-height:1.15;white-space:pre-line}
  .pv-body{font-size:16px;line-height:1.55;color:var(--fg);opacity:.92;white-space:pre-line;max-width:30ch}
  .pv-sub{font-size:13px;opacity:.55;white-space:pre-line;max-width:34ch}
  .pv-pill{margin-top:4px;display:inline-block;border:1.5px solid var(--accent);color:var(--accent);
           border-radius:999px;padding:9px 20px;font-size:14px;font-weight:600}
  .pv-pill.alt{border-color:var(--line);color:var(--fg);opacity:.7;font-weight:500}
  .pv-msg{margin-top:6px;background:var(--msgBg);border:1px solid var(--msgLine);border-radius:12px;padding:12px 14px;
          font-size:13px;line-height:1.5;color:var(--msgFg);white-space:pre-line;max-width:34ch;text-align:left}
  .pv-msg .tag{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ok);opacity:.7;margin-bottom:5px}

  /* optional phone frame */
  .card.framed .preview{max-width:300px;margin:14px auto;border-radius:30px;padding:40px 22px;
        border:8px solid var(--frame);box-shadow:0 10px 40px #0006;min-height:380px;justify-content:center}

  /* variant compare */
  .variants{display:flex;gap:10px;padding:0 18px 8px;flex-wrap:wrap}
  .variant{flex:1;min-width:200px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;
           background:var(--card);transition:border-color .15s}
  .variant.chosen{border-color:var(--ok);box-shadow:0 0 0 1px color-mix(in srgb,var(--ok) 40%,transparent)}
  .variant .vlabel{font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.5;display:flex;justify-content:space-between}
  .variant .vlabel .pick{color:var(--ok);font-weight:700;opacity:0}
  .variant.chosen .vlabel .pick{opacity:1}
  .variant .vtitle{font-family:var(--titleFont),sans-serif;color:var(--accent);font-size:15px;margin:6px 0 4px;white-space:pre-line}
  .variant .vbody{font-size:13px;line-height:1.5;opacity:.9;white-space:pre-line}

  /* edit fields */
  .edit{padding:4px 18px 8px;display:none;gap:10px;flex-direction:column}
  .card.editing .edit{display:flex}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.5;display:flex;justify-content:space-between}
  .fld .meta{opacity:.7;font-weight:500;text-transform:none;letter-spacing:0}
  .fld .meta.bad{color:var(--rej)}
  .fld input,.fld textarea{background:var(--inputBg);border:1px solid var(--line);border-radius:9px;color:var(--fg);
        font-family:inherit;font-size:14px;padding:9px 11px;resize:vertical}
  .fld textarea{min-height:64px;line-height:1.5}
  .lint{font-size:11.5px;line-height:1.5;min-height:0;display:flex;flex-wrap:wrap;gap:6px}
  .lint .flag{padding:1px 7px;border-radius:999px;font-weight:600}
  .lint .flag.ban{background:color-mix(in srgb,var(--rej) 22%,transparent);color:var(--rej)}
  .lint .flag.pref{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
  .lint .flag.line{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}

  .row{display:flex;gap:8px;padding:8px 18px 16px;flex-wrap:wrap;align-items:center}
  button.btn{background:var(--btnBg);color:var(--fg);border:1px solid var(--line);border-radius:9px;
        padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  button.btn:hover{filter:brightness(1.15)}
  .statusgroup{display:flex;gap:6px}
  .statusgroup button{opacity:.55}
  .statusgroup button.on{opacity:1}
  button.st-approved.on{background:color-mix(in srgb,var(--ok) 30%,var(--btnBg));border-color:var(--ok);color:var(--ok)}
  button.st-needs-work.on{background:color-mix(in srgb,var(--warn) 28%,var(--btnBg));border-color:var(--warn);color:var(--warn)}
  button.st-rejected.on{background:color-mix(in srgb,var(--rej) 28%,var(--btnBg));border-color:var(--rej);color:var(--rej)}
  .notewrap{padding:0 18px 14px}
  .notewrap textarea{width:100%;background:var(--inputBg);border:1px dashed var(--line);border-radius:9px;color:var(--fg);
        font-family:inherit;font-size:13px;padding:8px 11px;min-height:38px;line-height:1.5;resize:vertical}
  .notewrap textarea::placeholder{opacity:.4}

  .export{position:fixed;bottom:0;left:0;right:0;background:var(--headBg);backdrop-filter:blur(8px);
          border-top:1px solid var(--line);padding:11px 22px;display:flex;gap:10px;align-items:center;z-index:30;flex-wrap:wrap}
  .export .hint{font-size:12px;opacity:.5}
  button.exp{background:var(--accent);color:#1a1a33;border:none;border-radius:10px;
        padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
  button.exp.ghost{background:var(--btnBg);color:var(--fg);border:1px solid var(--line)}
  .export .spacer{margin-left:auto}

  dialog{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:14px;max-width:620px;width:92%;padding:0}
  dialog::backdrop{background:#0009}
  dialog .dhead{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
  dialog .dbody{padding:14px 18px}
  dialog textarea{width:100%;min-height:200px;background:var(--inputBg);color:var(--fg);border:1px solid var(--line);
        border-radius:9px;font-family:ui-monospace,monospace;font-size:12px;padding:10px}
  dialog .drow{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);justify-content:flex-end}
</style>
</head>
<body>
<header>
  <h1 id="projname">copy review</h1>
  <span class="sub">edit inline · set status &amp; leave a note · pick a variant · reorder · <b>export</b> sends it back to claude</span>
  <span class="count" id="count"></span>
</header>

<div class="toolbar">
  <label><input type="checkbox" id="onlyOpen"> show only unresolved</label>
  <label><input type="checkbox" id="frameToggle"> phone frame</label>
  <span class="keyhint">keys: <b>j/k</b> move · <b>a</b> approve · <b>n</b> needs-work · <b>r</b> reject · <b>e</b> edit</span>
</div>

<div class="wrap" id="wrap"></div>

<div class="export">
  <span class="hint">edits autosave in this browser</span>
  <button class="exp ghost" onclick="openImport()">import JSON ⤒</button>
  <button class="exp ghost" onclick="doExportMD()">copy markdown ⧉</button>
  <button class="exp" onclick="doExportJSON()">export for claude ⤓</button>
  <span class="spacer"></span>
</div>

<dialog id="importDlg">
  <div class="dhead">paste a prior export JSON to resume</div>
  <div class="dbody"><textarea id="importBox" placeholder='[ { "id": "...", ... } ]'></textarea></div>
  <div class="drow">
    <button class="exp ghost" onclick="document.getElementById('importDlg').close()">cancel</button>
    <button class="exp" onclick="applyImport()">load</button>
  </div>
</dialog>

<script>
/* ===========================================================================
   1. THEME  — project look. Pull from design tokens when known.
   =========================================================================== */
const THEME = {
  project:   "LashPop Admin · plain-language review",
  mode:      "light",                // "dark" | "light"  (sets sensible defaults)
  titleFont: "Playfair Display",     // display/title font (must be in the <link> above)
  bodyFont:  "Inter",                // body font (must be in the <link> above)
  phoneFrame:true,                   // default phone-frame preview on/off (toggleable in UI)
  // colors — override any of these; otherwise dark/light defaults below fill in.
  accent:    "#b5563d",              // titles, buttons, primary pill (brand accent)
  // optional explicit overrides (leave null to use mode defaults):
  fg:"#2d2926", bg:"#faf6f2", bg2:"#ffffff", card:"#ffffff", line:"#d9cec7",
  ok:"#557d79", warn:"#9a7a42", rej:"#a43f2b",
  previewBg:"linear-gradient(180deg,#fbf8f3,#f4f1ec)",
};

/* ===========================================================================
   2. LEXICON  — live guardrails. Words are matched case-insensitively, whole-word.
   =========================================================================== */
const LEXICON = {
  preferred: ["visitors","page views","tracked actions","media library","booking categories","daily update"],
  banned:    ["attention","momentum","signals","journey","Claude","LLM","DAM","taxonomy","worker tick","source of truth"],
  maxLineChars: 72,
};

/* ===========================================================================
   3. PIECES[]  — the copy beats.
   ---------------------------------------------------------------------------
   PHASE divider:   { phase: "section label" }
   PIECE schema:
   {
     id:    "unique-id",                  // REQUIRED, stable across edits
     name:  "short human label",          // shown in the card header
     when:  "when/where this appears",     // context note for the reviewer
     status:"approved"|"needs-work"|"rejected"|"" ,   // initial status (optional)

     // --- single-copy fields (used when `variants` is absent) ---
     title: "the headline",               // \n = deliberate hand-break
     body:  "the body copy\nbroken by hand",
     sub:   "(small caption)",            // optional, not editable-linted
     pill:  "primary button label",       // optional
     pillAlt:"secondary button label",    // optional
     msg:   "share message preview",      // optional (renders in a 'what your friend gets' box)

     // --- OR variant compare: provide 2+ options; reviewer picks a winner ---
     variants: [
       { title:"option A title", body:"option A body", pill:"go" },
       { title:"option B title", body:"option B body", pill:"let's go" },
     ],
     chosenVariant: 0,                    // initial winner index (optional)
   }
   Lint runs on title + body + pill + pillAlt + msg of the active copy.
   =========================================================================== */
const PIECES = [
  { phase: "Navigation and page purpose" },
  { id:"analytics-nav", name:"Analytics navigation", when:"Admin navigation on phone and desktop", chosenVariant:1,
    variants:[
      { title:"Website performance", body:"Traffic, discovery, and conversion signals" },
      { title:"Website analytics", body:"Visitors, page views and tracked actions" },
    ] },
  { id:"analytics-intro", name:"Analytics page introduction", when:"Top of /admin/analytics", chosenVariant:1,
    variants:[
      { title:"Website performance", body:"See anonymous traffic and action signals, then confirm appointments in Vagaro and saved enquiries in the Inbox." },
      { title:"Website analytics", body:"See visitors, page views and recorded website actions. Check appointments in Vagaro and applications in Inbox." },
    ] },
  { id:"analytics-privacy", name:"Analytics privacy summary", when:"Under the Analytics page title", chosenVariant:1,
    variants:[
      { title:"Anonymous aggregates only", body:"No customer profiles" },
      { title:"Totals only", body:"No names or contact details" },
    ] },

  { phase: "Analytics measures" },
  { id:"analytics-chart", name:"Traffic chart", when:"Analytics Overview", chosenVariant:1,
    variants:[
      { title:"How attention moved", body:"Traffic rhythm" },
      { title:"Visitors and page views by day", body:"Website traffic" },
    ] },
  { id:"analytics-booking", name:"Booking comparison", when:"Analytics Overview and Tracked actions", chosenVariant:1,
    variants:[
      { title:"Booking signal rate", body:"Completions divided by starts in this period—not a customer cohort." },
      { title:"Vagaro submissions ÷ tracked booking starts", body:"Separate event totals. A submission may be a booking request or confirmation; check Vagaro for the final status." },
    ] },
  { id:"analytics-sources", name:"Source limitations", when:"Analytics Sources", chosenVariant:1,
    variants:[
      { title:"Read this as discovery, not attribution", body:"Direct traffic can include bookmarks, typed addresses and visits where the referring site was not shared." },
      { title:"Sources do not prove what caused a visit", body:"Direct or not provided can include typed addresses, bookmarks and visits where the browser did not share a referring site." },
    ] },
  { id:"analytics-actions", name:"Action-count explanation", when:"Analytics Tracked actions", chosenVariant:1,
    variants:[
      { title:"These are directional signals", body:"Repeats can count again, and some booking paths finish outside the embedded Vagaro flow." },
      { title:"How tracked actions are counted", body:"Each event is counted, including repeat actions by the same visitor. Starts and submissions are separate totals, not a visitor-by-visitor funnel." },
    ] },
  { id:"analytics-pages", name:"Page ranking", when:"Analytics Pages", chosenVariant:1,
    variants:[
      { title:"Pages earning attention", body:"Private, preview, admin and system paths are removed before these totals reach the board." },
      { title:"Most-viewed public pages", body:"Only approved public pages are listed. Admin, preview and system pages are excluded. Individual service pages are grouped together." },
    ] },

  { phase: "Loading, empty and error states" },
  { id:"analytics-empty", name:"Analytics empty state", when:"No visits or tracked actions in the selected period", chosenVariant:1,
    variants:[
      { title:"No activity in this period yet", body:"No public traffic or action signals matched these days. Try a longer period." },
      { title:"No website data for the selected period", body:"The connection works, but there were no public page views or tracked actions in these days. Choose a longer period." },
    ] },
  { id:"analytics-error", name:"Analytics connection error", when:"Analytics cannot connect", chosenVariant:1,
    variants:[
      { title:"Connection needed", body:"Website performance is not connected in this environment yet.", pill:"Try again" },
      { title:"Website analytics is not connected", body:"This page only reads analytics. Trying again does not change the website, bookings or customer information.", pill:"Try again" },
    ] },

  { phase: "Website, reviews and media" },
  { id:"media-name", name:"Media navigation and help", when:"Media library, selectors and tour", chosenVariant:1,
    variants:[
      { title:"LashPop DAM", body:"Use the Command Palette as your control center for every DAM action." },
      { title:"Media library", body:"Open Actions with / or Command-K to search, filter, group files or change tags." },
    ] },
  { id:"booking-categories", name:"Booking categories", when:"Website Services", chosenVariant:1,
    variants:[
      { title:"Booking taxonomy", body:"Taxonomy needs attention." },
      { title:"Booking categories", body:"Link each Vagaro category to the matching website category." },
    ] },
  { id:"review-score", name:"Review score action", when:"Review editor", chosenVariant:1,
    variants:[
      { title:"Re-score with Claude", body:"The mesh-claude bridge is unreachable.", pill:"Re-score" },
      { title:"Update score", body:"Review score updates are temporarily unavailable. Try again later.", pill:"Update score" },
    ] },
  { id:"review-schedule", name:"Review update schedule", when:"Review display rules", chosenVariant:1,
    variants:[
      { title:"Review pipeline", body:"Saved values take effect on the next daily Worker tick." },
      { title:"Review display rules", body:"Saved changes are used during the next daily review update." },
    ] },
  { id:"website-ownership", name:"Website ownership badges", when:"Website overview", chosenVariant:1,
    variants:[
      { title:"Mixed", body:"LashPop · Vagaro · Automation · System" },
      { title:"Vagaro and Admin", body:"Edit here · Edit in Vagaro · Updates automatically · View only" },
    ] },
  { id:"website-version", name:"Website version source", when:"Website editors before the first Admin save", chosenVariant:1,
    variants:[
      { title:"Not published yet", body:"Managed by the website" },
      { title:"No Admin version saved", body:"Using website defaults" },
    ] },
  { id:"seo-summary", name:"Search summary", when:"Search and sharing editor", chosenVariant:1,
    variants:[
      { title:"Description for AI search services", body:"Optional custom introduction for your llms.txt file." },
      { title:"Additional business summary", body:"Optional summary used by automated search tools. Leave it blank to use the business and service details above." },
    ] },
  { id:"vagaro-update-error", name:"Vagaro update error", when:"Settings", chosenVariant:1,
    variants:[
      { title:"Vagaro connection", body:"Raw provider error details" },
      { title:"Latest Vagaro update", body:"The Vagaro update did not finish. Open Vagaro sync for details and try again." },
    ] },
];

/* ===========================================================================
   ENGINE  — generic; rarely needs editing.
   =========================================================================== */
const DARK = { fg:"#F1E7D4", bg:"#15152b", bg2:"#1e1e3a", card:"#23234180", line:"#3a3a60",
  ok:"#5fd6a0", warn:"#f2c14e", rej:"#ff7a7a", previewBg:"linear-gradient(180deg,#1b1b36,#161630)",
  pvLine:"#2c2c4e", inputBg:"#14142a", btnBg:"#2a2a4c", headBg:"#101025ee",
  msgBg:"#0e1c17", msgLine:"#244a3a", msgFg:"#cfeedd", frame:"#0c0c1c",
  bgGrad:"radial-gradient(1200px 800px at 50% -10%, #20203f, #15152b)" };
const LIGHT = { fg:"#2a2520", bg:"#faf6ee", bg2:"#fff", card:"#ffffffcc", line:"#e3dccb",
  ok:"#1f9d6b", warn:"#c98a1e", rej:"#d6453f", previewBg:"linear-gradient(180deg,#fffdf8,#f4ecdc)",
  pvLine:"#e8e0cf", inputBg:"#fff", btnBg:"#f1ead9", headBg:"#fdfaf3ee",
  msgBg:"#eef7f0", msgLine:"#bfe3cc", msgFg:"#1f5237", frame:"#d8cfba",
  bgGrad:"radial-gradient(1200px 800px at 50% -10%, #fffdf6, #f6efe0)" };

function buildTheme(){
  const base = THEME.mode === "light" ? LIGHT : DARK;
  const t = {...base};
  ["fg","bg","bg2","card","line","ok","warn","rej","previewBg"].forEach(k=>{ if(THEME[k]) t[k]=THEME[k]; });
  document.documentElement.style.colorScheme = THEME.mode==="light"?"light":"dark";
  document.getElementById('themecss').textContent = `:root{
    --fg:${t.fg}; --bg:${t.bg}; --bg2:${t.bg2}; --card:${t.card}; --line:${t.line};
    --accent:${THEME.accent}; --ok:${t.ok}; --warn:${t.warn}; --rej:${t.rej};
    --bgGrad:${t.bgGrad}; --pvBg:${t.previewBg}; --pvLine:${t.pvLine};
    --inputBg:${t.inputBg}; --btnBg:${t.btnBg}; --headBg:${t.headBg};
    --msgBg:${t.msgBg}; --msgLine:${t.msgLine}; --msgFg:${t.msgFg}; --frame:${t.frame};
    --titleFont:'${THEME.titleFont}'; --bodyFont:'${THEME.bodyFont}'; }`;
  document.getElementById('projname').textContent = THEME.project;
  document.title = THEME.project;
}
buildTheme();

const KEY = "copyreview_" + (THEME.project||"x").toLowerCase().replace(/[^a-z0-9]+/g,'_');
let saved = {}; try{ saved = JSON.parse(localStorage.getItem(KEY) || "{}"); }catch{}
const wrap = document.getElementById('wrap');
let order = []; // array of piece ids in current display order
let focusIdx = -1;

const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const attr = s => esc(s).replace(/"/g,"&quot;");

// merge a piece's saved state over its defaults
function model(p){
  const s = saved[p.id] || {};
  const m = {
    title:s.title ?? p.title, body:s.body ?? p.body,
    pill:s.pill ?? p.pill, pillAlt:s.pillAlt ?? p.pillAlt, msg:s.msg ?? p.msg,
    sub:p.sub,
    status:s.status ?? p.status ?? "",
    note:s.note ?? "",
    chosenVariant: s.chosenVariant ?? p.chosenVariant ?? (p.variants ? 0 : undefined),
  };
  return m;
}

/* --- lexicon lint --- */
const wordRe = w => new RegExp("\\b"+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+"\\b","gi");
function lint(text){
  const flags = [];
  (LEXICON.banned||[]).forEach(w=>{ if(wordRe(w).test(text)) flags.push({t:"ban", w}); });
  (LEXICON.preferred||[]).forEach(w=>{ if(wordRe(w).test(text)) flags.push({t:"pref", w}); });
  const longLines = (text||"").split("\n").filter(l=>l.length > (LEXICON.maxLineChars||42));
  if(longLines.length) flags.push({t:"line", w:longLines.length+" long line"+(longLines.length>1?"s":"")});
  return flags;
}
function lintHTML(text){
  const f = lint(text);
  return f.map(x=>`<span class="flag ${x.t}">${x.t==='ban'?'avoid: ':x.t==='pref'?'✓ ':''}${esc(x.w)}</span>`).join("");
}
function activeCopy(m){ return [m.title,m.body,m.pill,m.pillAlt,m.msg].filter(Boolean).join("\n"); }

/* --- render one piece card --- */
function buildCard(p){
  const m = model(p);
  const card = document.createElement('div');
  card.className = 'card' + (m.status?(' status-'+m.status):'') + (THEME.phoneFrame?' framed':'');
  card.dataset.id = p.id;

  const hasV = Array.isArray(p.variants) && p.variants.length;
  const active = hasV ? p.variants[m.chosenVariant||0] : m;
  const av = {
    title:m.title ?? active.title, body:m.body ?? active.body,
    pill:(m.pill ?? active.pill), pillAlt:(m.pillAlt ?? active.pillAlt), msg:(m.msg ?? active.msg),
  };

  const variantsHTML = hasV ? `<div class="variants">${p.variants.map((v,i)=>`
      <div class="variant${(m.chosenVariant||0)===i?' chosen':''}" data-vi="${i}">
        <div class="vlabel"><span>option ${String.fromCharCode(65+i)}</span><span class="pick">✓ picked</span></div>
        <div class="vtitle">${esc(v.title||'')}</div>
        <div class="vbody">${esc(v.body||'')}</div>
      </div>`).join("")}</div>` : "";

  card.innerHTML = `
    <div class="chead">
      <span class="grip" title="drag to reorder">⠿</span>
      <span class="name">${esc(p.name)}</span><span class="when">${esc(p.when)}</span>
      <span class="movebtns"><button data-mv="up" title="move up">▲</button><button data-mv="down" title="move down">▼</button><button data-mv="del" title="remove">✕</button></span>
    </div>
    ${variantsHTML}
    <div class="preview">
      <div class="pv-title" data-pv="title">${esc(av.title)}</div>
      <div class="pv-body" data-pv="body">${esc(av.body)}</div>
      ${m.sub?`<div class="pv-sub">${esc(m.sub)}</div>`:""}
      ${av.msg!==undefined?`<div class="pv-msg"><span class="tag">what your friend receives</span><span data-pv="msg">${esc(av.msg)}</span></div>`:""}
      ${av.pill!==undefined?`<div><span class="pv-pill" data-pv="pill">${esc(av.pill)}</span> ${av.pillAlt!==undefined?`<span class="pv-pill alt" data-pv="pillAlt">${esc(av.pillAlt)}</span>`:""}</div>`:""}
    </div>
    <div class="edit">
      <div class="fld"><label>title <span class="meta" data-meta="title"></span></label><input data-ed="title" value="${attr(av.title)}"></div>
      <div class="fld"><label>body <span class="meta" data-meta="body"></span></label><textarea data-ed="body">${esc(av.body)}</textarea></div>
      ${av.pill!==undefined?`<div class="fld"><label>button</label><input data-ed="pill" value="${attr(av.pill)}"></div>`:""}
      ${av.pillAlt!==undefined?`<div class="fld"><label>secondary button</label><input data-ed="pillAlt" value="${attr(av.pillAlt)}"></div>`:""}
      ${av.msg!==undefined?`<div class="fld"><label>share message</label><textarea data-ed="msg">${esc(av.msg)}</textarea></div>`:""}
      <div class="lint" data-lint></div>
    </div>
    <div class="row">
      <button class="btn" data-act="edit">edit</button>
      <span class="statusgroup">
        <button class="btn st-approved${m.status==='approved'?' on':''}" data-st="approved">✓ approved</button>
        <button class="btn st-needs-work${m.status==='needs-work'?' on':''}" data-st="needs-work">~ needs work</button>
        <button class="btn st-rejected${m.status==='rejected'?' on':''}" data-st="rejected">✕ rejected</button>
      </span>
    </div>
    <div class="notewrap"><textarea data-note placeholder="note to claude — what to change, why…">${esc(m.note)}</textarea></div>`;

  // wire: edit toggle
  card.querySelector('[data-act="edit"]').onclick = ()=> card.classList.toggle('editing');

  // wire: status buttons (click active one again to clear)
  card.querySelectorAll('[data-st]').forEach(b=>{
    b.onclick = ()=>{
      const val = b.dataset.st;
      const cur = currentStatus(card);
      setStatus(card, cur===val ? "" : val);
    };
  });

  // wire: variant pick
  card.querySelectorAll('[data-vi]').forEach(v=>{
    v.onclick = ()=>{
      const i = +v.dataset.vi;
      card.querySelectorAll('[data-vi]').forEach(x=>x.classList.toggle('chosen', +x.dataset.vi===i));
      // load the chosen variant into the editable fields + preview
      const chosen = p.variants[i];
      ['title','body','pill','pillAlt','msg'].forEach(k=>{
        const ed = card.querySelector(`[data-ed="${k}"]`); const pv = card.querySelector(`[data-pv="${k}"]`);
        if(ed && chosen[k]!==undefined){ ed.value = chosen[k]; }
        if(pv && chosen[k]!==undefined){ pv.textContent = chosen[k]; }
      });
      persist(p.id, card, i); runLint(card);
    };
  });

  // wire: edit fields -> live preview + persist + lint
  card.querySelectorAll('[data-ed]').forEach(el=>{
    el.oninput = ()=>{
      const k = el.dataset.ed;
      const pv = card.querySelector(`[data-pv="${k}"]`); if(pv) pv.textContent = el.value;
      persist(p.id, card); runLint(card);
    };
  });
  // wire: note
  card.querySelector('[data-note]').oninput = ()=> persist(p.id, card);

  // wire: reorder + delete
  card.querySelector('[data-mv="up"]').onclick   = ()=> moveCard(p.id, -1);
  card.querySelector('[data-mv="down"]').onclick = ()=> moveCard(p.id, +1);
  card.querySelector('[data-mv="del"]').onclick  = ()=>{ if(confirm('remove this piece from the review?')) removeCard(p.id); };

  // drag reorder
  card.draggable = false;
  const grip = card.querySelector('.grip');
  grip.addEventListener('mousedown', ()=> card.draggable = true);
  card.addEventListener('dragend', ()=> card.draggable = false);
  card.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', p.id); card.style.opacity=.4; });
  card.addEventListener('dragover', e=>{ e.preventDefault(); });
  card.addEventListener('drop', e=>{
    e.preventDefault(); card.style.opacity='';
    const from = e.dataTransfer.getData('text/plain'); if(from && from!==p.id) reorderTo(from, p.id);
  });

  runLint(card);
  return card;
}

function currentStatus(card){
  const on = card.querySelector('.statusgroup .on');
  return on ? on.dataset.st : "";
}
function setStatus(card, val){
  card.classList.remove('status-approved','status-needs-work','status-rejected');
  if(val) card.classList.add('status-'+val);
  card.querySelectorAll('[data-st]').forEach(b=> b.classList.toggle('on', b.dataset.st===val));
  persist(card.dataset.id, card); updateCount(); applyFilter();
}
function runLint(card){
  const m = {};
  card.querySelectorAll('[data-ed]').forEach(el=> m[el.dataset.ed]=el.value);
  card.querySelector('[data-lint]').innerHTML = lintHTML(activeCopy(m));
  // per-field meta (char/line counts; flag long lines on title/body)
  ['title','body'].forEach(k=>{
    const ed = card.querySelector(`[data-ed="${k}"]`); const meta = card.querySelector(`[data-meta="${k}"]`);
    if(!ed||!meta) return;
    const lines = ed.value.split("\n"); const longest = Math.max(0,...lines.map(l=>l.length));
    const bad = longest > (LEXICON.maxLineChars||42);
    meta.textContent = `${ed.value.length} chars · ${lines.length} line${lines.length>1?'s':''} · longest ${longest}`;
    meta.classList.toggle('bad', bad);
  });
}

function persist(id, card, chosenVariant){
  const o = { status: currentStatus(card) };
  card.querySelectorAll('[data-ed]').forEach(el=> o[el.dataset.ed]=el.value);
  const note = card.querySelector('[data-note]'); if(note) o.note = note.value;
  const cv = chosenVariant ?? (saved[id]?.chosenVariant);
  if(cv!==undefined) o.chosenVariant = cv;
  saved[id] = o; localStorage.setItem(KEY, JSON.stringify(saved));
}

/* --- order management --- */
function pieceById(id){ return PIECES.find(p=>p.id===id); }
function moveCard(id, dir){
  const i = order.indexOf(id); const j = i+dir;
  if(i<0||j<0||j>=order.length) return;
  [order[i],order[j]] = [order[j],order[i]];
  saveOrder(); render();
}
function reorderTo(fromId, toId){
  order.splice(order.indexOf(fromId),1);
  order.splice(order.indexOf(toId),0,fromId);
  saveOrder(); render();
}
function removeCard(id){
  order = order.filter(x=>x!==id);
  saved[id] = {...(saved[id]||{}), _removed:true};
  saveOrder(); localStorage.setItem(KEY, JSON.stringify(saved)); render();
}
function saveOrder(){ saved._order = order; localStorage.setItem(KEY, JSON.stringify(saved)); }

/* --- render the full list (preserving phases + order) --- */
function render(){
  wrap.innerHTML = "";
  // group: phases appear in their original spot; pieces follow `order`.
  // Strategy: render phase dividers inline as we hit their following pieces.
  const phaseFor = {}; let curPhase = null;
  PIECES.forEach(p=>{ if(p.phase){ curPhase = p.phase; } else { phaseFor[p.id] = curPhase; } });
  let shownPhase = null;
  order.forEach(id=>{
    const p = pieceById(id); if(!p) return;
    if(phaseFor[id] && phaseFor[id]!==shownPhase){
      shownPhase = phaseFor[id];
      const h = document.createElement('div'); h.className='phase'; h.textContent = shownPhase; wrap.appendChild(h);
    }
    wrap.appendChild(buildCard(p));
  });
  updateCount(); applyFilter(); applyFrame();
}

function updateCount(){
  const cards = [...document.querySelectorAll('.card')];
  const total = cards.length;
  const c = s => cards.filter(x=>x.classList.contains('status-'+s)).length;
  document.getElementById('count').innerHTML =
    `<span class="pill-stat ok">${c('approved')} ✓</span>`+
    `<span class="pill-stat warn">${c('needs-work')} ~</span>`+
    `<span class="pill-stat rej">${c('rejected')} ✕</span>`+
    `<span><b>${c('approved')}</b> / ${total}</span>`;
}

/* --- filter / frame toggles --- */
function applyFilter(){
  const only = document.getElementById('onlyOpen').checked;
  document.querySelectorAll('.card').forEach(card=>{
    const resolved = card.classList.contains('status-approved') || card.classList.contains('status-rejected');
    card.classList.toggle('hidden', only && resolved);
  });
}
function applyFrame(){
  document.querySelectorAll('.card').forEach(c=> c.classList.toggle('framed', document.getElementById('frameToggle').checked));
}
document.getElementById('onlyOpen').onchange = applyFilter;
document.getElementById('frameToggle').onchange = ()=>{ THEME.phoneFrame=document.getElementById('frameToggle').checked; applyFrame(); };
document.getElementById('frameToggle').checked = !!THEME.phoneFrame;

/* --- keyboard flow: j/k move focus, a/n/r status, e edit --- */
function visibleCards(){ return [...document.querySelectorAll('.card:not(.hidden)')]; }
function focusCard(i){
  const cards = visibleCards(); if(!cards.length) return;
  focusIdx = Math.max(0, Math.min(i, cards.length-1));
  cards.forEach((c,idx)=> c.classList.toggle('focused', idx===focusIdx));
  cards[focusIdx].scrollIntoView({behavior:'smooth', block:'center'});
}
document.addEventListener('keydown', e=>{
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const cards = visibleCards();
  if(e.key==='j'){ focusCard(focusIdx+1); }
  else if(e.key==='k'){ focusCard(focusIdx-1); }
  else if(['a','n','r','e'].includes(e.key) && cards[focusIdx]){
    const card = cards[focusIdx];
    if(e.key==='e') card.classList.toggle('editing');
    else setStatus(card, {a:'approved', n:'needs-work', r:'rejected'}[e.key]);
  }
});

/* --- exports --- */
function collect(){
  return order.map(id=>{
    const p = pieceById(id); const card = document.querySelector(`.card[data-id="${id}"]`);
    if(!p||!card) return null;
    const o = { id, name:p.name, status: currentStatus(card)||"unreviewed" };
    card.querySelectorAll('[data-ed]').forEach(el=> o[el.dataset.ed]=el.value);
    const note = card.querySelector('[data-note]').value.trim(); if(note) o.note = note;
    if(Array.isArray(p.variants)){
      o.chosenVariant = saved[id]?.chosenVariant ?? 0;
      o.chosenVariantLabel = String.fromCharCode(65 + (o.chosenVariant||0));
    }
    return o;
  }).filter(Boolean);
}
function doExportJSON(){
  /* SCHEMA Claude consumes:
     [ { id, name, status:"approved|needs-work|rejected|unreviewed",
         title, body, pill?, pillAlt?, msg?, note?, chosenVariant?, chosenVariantLabel? }, ... ]
     Array order == final reviewer-chosen order. Removed pieces are absent. */
  const json = JSON.stringify({ project:THEME.project, exportedAt:new Date().toISOString(), pieces:collect() }, null, 2);
  navigator.clipboard?.writeText(json).catch(()=>{});
  download(json, 'copy_review.json', 'application/json');
  alert('copied to clipboard + downloaded copy_review.json — paste it back to claude');
}
function doExportMD(){
  const rows = collect().map((o,i)=>{
    const mark = {approved:'✅',['needs-work']:'🟡',rejected:'❌',unreviewed:'⬜'}[o.status]||'⬜';
    let s = `### ${i+1}. ${o.name}  ${mark} _${o.status}_\n`;
    if(o.chosenVariantLabel) s += `*chosen variant: ${o.chosenVariantLabel}*\n`;
    s += `\n> **${o.title.replace(/\n/g,' / ')}**\n>\n> ${o.body.replace(/\n/g,'  \n> ')}\n`;
    if(o.pill) s += `\n\`[ ${o.pill} ]\`${o.pillAlt?` \`[ ${o.pillAlt} ]\``:''}\n`;
    if(o.note) s += `\n📝 **note:** ${o.note}\n`;
    return s;
  }).join('\n---\n\n');
  const md = `# ${THEME.project} — copy review\n\n${rows}\n`;
  navigator.clipboard?.writeText(md).catch(()=>{});
  alert('markdown summary copied to clipboard');
}
function download(text, name, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text],{type})); a.download = name; a.click();
}

/* --- import / resume --- */
function openImport(){ document.getElementById('importDlg').showModal(); }
function applyImport(){
  let data; try{ data = JSON.parse(document.getElementById('importBox').value); }catch(e){ alert('not valid JSON'); return; }
  const arr = Array.isArray(data) ? data : (data.pieces||[]);
  const newOrder = [];
  arr.forEach(o=>{
    if(!o.id || !pieceById(o.id)) return;
    const cur = saved[o.id] || {};
    saved[o.id] = { ...cur,
      title:o.title ?? cur.title, body:o.body ?? cur.body, pill:o.pill ?? cur.pill,
      pillAlt:o.pillAlt ?? cur.pillAlt, msg:o.msg ?? cur.msg, note:o.note ?? cur.note,
      status:(o.status && o.status!=='unreviewed') ? o.status : (cur.status||""),
      chosenVariant:o.chosenVariant ?? cur.chosenVariant };
    newOrder.push(o.id);
  });
  // keep any pieces that weren't in the import at the end
  PIECES.filter(p=>p.id && !newOrder.includes(p.id)).forEach(p=>newOrder.push(p.id));
  order = newOrder; saveOrder(); localStorage.setItem(KEY, JSON.stringify(saved));
  document.getElementById('importDlg').close(); render();
}

/* --- boot --- */
function initOrder(){
  const ids = PIECES.filter(p=>p.id && !(saved[p.id]?._removed)).map(p=>p.id);
  if(Array.isArray(saved._order)){
    order = saved._order.filter(id=>ids.includes(id));
    ids.forEach(id=>{ if(!order.includes(id)) order.push(id); }); // append newly-added pieces
  } else { order = ids; }
}
initOrder();
render();
</script>
