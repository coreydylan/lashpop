name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_FIXTURES: "1"
      NEXT_PUBLIC_MAPBOX_TOKEN: "pk.ci-fixture"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:launch

  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_FIXTURES: "1"
      NEXT_PUBLIC_MAPBOX_TOKEN: "pk.ci-fixture"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:visual
      - if: always()
        run: npm run test:a11y
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-regression-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
            tests/browser/*-snapshots/*-linux.png
          if-no-files-found: ignore
          retention-days: 7
